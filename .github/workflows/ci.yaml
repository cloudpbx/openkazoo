name: CI

on:
  push:
    branches: ["4.4"]
  pull_request:
    branches: ["4.4"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OTP_VERSION: "26"
  REBAR3_VERSION: "3.27.0"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Install emacs
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends emacs-nox

      - name: Restore rebar3 cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build/default/plugins
          key: rebar3-fmt-otp${{ env.OTP_VERSION }}-${{ hashFiles('rebar.config') }}
          restore-keys: rebar3-fmt-otp${{ env.OTP_VERSION }}-

      - name: Check code formatting
        run: make format-check

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      rabbitmq:
        image: rabbitmq:3.13.7-management
        ports:
          - 5672:5672
      couchdb:
        image: couchdb:3
        ports:
          - 5984:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            netcat-traditional \
            curl \
            ghostscript \
            libreoffice \
            fonts-dejavu \
            libtiff-tools

      - name: Restore rebar3 cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar3-build-otp${{ env.OTP_VERSION }}-${{ hashFiles('rebar.config', 'rebar.lock', 'core/*/rebar.config', 'applications/*/rebar.config') }}
          restore-keys: rebar3-build-otp${{ env.OTP_VERSION }}-

      # Keep only third-party deps from the cache so stale beams of deleted modules can't mask failures.
      - name: Drop cached project apps
        run: |
          for app in core/* applications/*; do
            rm -rf _build/*/lib/"$(basename "$app")"
          done

      - name: Wait for CouchDB
        run: |
          timeout=120
          until curl -s -f -o /dev/null -u admin:password http://localhost:5984/_up; do
            if [ $timeout -eq 0 ]; then
              echo "CouchDB not responding in time"
              docker logs ${{ job.services.couchdb.id }}
              exit 1
            fi
            timeout=$((timeout-1))
            sleep 1
          done

      - name: Initialize CouchDB
        run: |
          for db in _users _replicator _global_changes; do
            curl -s -u admin:password -X PUT "http://localhost:5984/$db?n=1&q=1"
          done

      - name: Wait for RabbitMQ
        run: |
          timeout=60
          until nc -z localhost 5672; do
            if [ $timeout -eq 0 ]; then
              echo "RabbitMQ not responding in time"
              exit 1
            fi
            timeout=$((timeout-1))
            sleep 1
          done

      - name: Prepare Kazoo config
        run: |
          sudo mkdir -p /etc/kazoo
          sudo cp ./config/config-ci.ini /etc/kazoo/config.ini
          chmod +x ./scripts/*

      - name: Compile
        run: make compile

      - name: EUnit
        run: make test

      - name: Common Test
        run: make ct

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: _build/test/logs
