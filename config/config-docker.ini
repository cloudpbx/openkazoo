; kazoo config for docker-compose (targets the rabbitmq/couchdb service names).
; `make test` ignores this and uses config-test.ini (fixturedb, no services).

[amqp]
uri = "amqp://guest:guest@rabbitmq:5672"

[kazoo_apps]
cookie = change_me

[ecallmgr]
cookie = change_me

[log]
syslog = info
console = notice
file = error

[data]
config = couchdb3

[couchdb3]
ip = "couchdb"
port = 5984
username = admin
password = password
